use_default_settings: true

general:
  instance_name: "DuckBotSearch"
  enable_metrics: false

search:
  safe_search: 1
  autocomplete: "duckduckgo"
  default_lang: "en-US"
  formats:
    - html
    - json

server:
  secret_key: "duckbot-search-change-me"
  limiter: false
  image_proxy: false
  public_instance: false

engines:
  - name: google
    engine: google
    shortcut: go
    disabled: false
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
